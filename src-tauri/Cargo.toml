[package]
name = "vasya-assistant"
version = "0.1.0"
description = "Local voice assistant for Windows"
edition = "2021"
rust-version = "1.90"
default-run = "vasya-assistant"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-single-instance", "dep:tauri-build"]

[lib]
name = "vasya"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tungstenite = "0.26"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
windows = { version = "0.61", features = [
  "Media_Control", "Foundation", "Foundation_Collections",
  "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com",
  "Win32_Media_Speech", "Win32_System_Threading",
  "Win32_UI_Shell", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"
] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

