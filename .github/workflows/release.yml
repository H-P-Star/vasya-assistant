name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.Substring(1)
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ($tag -ne $npm -or $tag -ne $tauri -or $tag -ne $cargo) { throw 'Tag and application versions must match' }
      - run: npm ci
      - run: ./scripts/prepare-bundle.ps1
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: npm run tauri build -- --target x86_64-pc-windows-msvc
      - name: Install and test bundled recognition
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Vasya install test'
          $process = Start-Process $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $report = Join-Path $env:RUNNER_TEMP 'vasya-self-test.json'
          $exe = Join-Path $destination 'vasya-assistant.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'vasya-clean-user'
          $process = Start-Process $exe -ArgumentList @('--self-test-output', "`"$report`"") -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'Installed Vosk self-test failed' }
          Get-FileHash $installer -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($installer))" } | Set-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            SHA256SUMS.txt
